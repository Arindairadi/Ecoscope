[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "iradi2222", email = "67781549-iradi2222@users.noreply.replit.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.7",
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pycountry>=26.2.16",
    "pymannkendall>=1.4.3",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "uvicorn>=0.54.0",
    "xarray>=2026.9.0",
]

[project.scripts]
repl-nix-workspace = "repl_nix_workspace:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
